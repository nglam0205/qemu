name: Build QEMU Gunyah ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-qemu-gunyah.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build QEMU Gunyah ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120

    env:
      GUNYAH_TAG: patchew/20240516143356.1739402-1-quic._5Fsvaddagi@quicinc.com

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential \
            ninja-build meson pkg-config \
            python3 python3-venv \
            flex bison \
            libglib2.0-dev \
            libpixman-1-dev \
            zlib1g-dev \
            libfdt-dev \
            libslirp-dev \
            libcapstone-dev \
            libaio-dev \
            liburing-dev \
            libnuma-dev \
            libgcrypt20-dev \
            libgnutls28-dev \
            libbz2-dev \
            liblz4-dev \
            libzstd-dev \
            libusb-1.0-0-dev

      - name: Checkout QEMU Gunyah
        run: |
          git init qemu
          cd qemu

          git remote add origin https://github.com/patchew-project/qemu.git

          git fetch --depth=1 origin \
            "refs/tags/${GUNYAH_TAG}:refs/tags/gunyah-v2"

          git checkout --detach gunyah-v2

          echo "===== QEMU VERSION ====="
          cat VERSION

          echo "===== SUBMODULE CONFIGURATION ====="
          cat .gitmodules

      - name: Configure QEMU
        working-directory: qemu
        run: |
          mkdir -p build
          cd build

          ../configure \
            --target-list=aarch64-softmmu \
            --enable-gunyah \
            --disable-werror \
            --disable-docs \
            --disable-gtk \
            --disable-sdl \
            --disable-opengl \
            --disable-vnc

      - name: Compile QEMU
        working-directory: qemu/build
        run: |
          echo "CPU threads: $(nproc)"
          ninja -j"$(nproc)"

      - name: Verify Gunyah accelerator
        working-directory: qemu/build
        run: |
          set -e

          ./qemu-system-aarch64 --version

          ./qemu-system-aarch64 -accel help \
            2>&1 | tee gunyah-accelerators.txt

          if ! grep -qi gunyah gunyah-accelerators.txt; then
            echo "ERROR: Gunyah accelerator not found"
            exit 1
          fi

          echo "Gunyah accelerator detected!"

      - name: Package binary
        run: |
          mkdir -p output

          cp qemu/build/qemu-system-aarch64 output/
          cp qemu/build/gunyah-accelerators.txt output/

          cat > output/README.txt <<'EOF'
          QEMU Gunyah ARM64

          Architecture: ARM64
          Target: aarch64-softmmu
          Accelerator: Gunyah

          Build: GitHub Actions

          This binary is built for Linux ARM64.
          It is not an Android APK.

          Gunyah requires a compatible host kernel
          and Gunyah hypervisor interface.
          EOF

          tar -czf qemu-gunyah-arm64.tar.gz output/

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: qemu-gunyah-arm64
          path: qemu-gunyah-arm64.tar.gz
          if-no-files-found: error
          retention-days: 30
